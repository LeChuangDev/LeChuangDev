name: 更新 README 动态内容

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: 生成 README 动态内容
        env:
          # 在 Settings → Secrets and variables → Actions → Variables 里配置
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL }}
          WAKATIME_RAW_URL: ${{ vars.WAKATIME_RAW_URL }}
        run: python build_readme.py

      - name: 提交变更
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 README 动态内容"
          git push